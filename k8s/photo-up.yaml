# ---------------------------------------------------------------------------
# PhotoUp — Kubernetes stack (app + MySQL), managed by Argo CD.
# Argo CD syncs this folder (path: k8s/) from the repo and applies it to the
# cluster. Git is the single source of truth.
#
# SECRETS WARNING: the Secret below contains DEMO-ONLY values so the stack
# runs end-to-end through GitOps. Real deployments must NOT store credentials
# in a public repo — replace the Secret with SealedSecrets, SOPS or an
# external secrets controller.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: photo-up
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: photoup-config
  namespace: photo-up
data:
  PORT: "3000"
  DB_HOST: photoup-mysql
  DB_PORT: "3306"
  DB_NAME: photoup
  DB_USER: photoup
  UPLOAD_DIR: /app/uploads
  PUBLIC_DIR: /app/public
---
# Applied by the MySQL image on first boot (empty data volume).
apiVersion: v1
kind: ConfigMap
metadata:
  name: photoup-init-sql
  namespace: photo-up
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
      id CHAR(36) PRIMARY KEY,
      name VARCHAR(120) NOT NULL,
      email VARCHAR(255) NOT NULL UNIQUE,
      password_hash VARCHAR(100) NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4;

    CREATE TABLE IF NOT EXISTS photos (
      id CHAR(36) PRIMARY KEY,
      user_id CHAR(36) NOT NULL,
      name VARCHAR(255) NOT NULL,
      stored_name VARCHAR(255) NOT NULL,
      mime_type VARCHAR(100) NOT NULL,
      size_bytes BIGINT UNSIGNED NOT NULL,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      CONSTRAINT fk_photos_user
        FOREIGN KEY (user_id) REFERENCES users (id)
        ON DELETE CASCADE
        ON UPDATE CASCADE
    ) ENGINE = InnoDB DEFAULT CHARSET = utf8mb4;

    CREATE INDEX idx_photos_user ON photos (user_id, created_at);
---
apiVersion: v1
kind: Secret
metadata:
  name: photoup-secrets
  namespace: photo-up
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: photoup-root-pw-DEMO
  MYSQL_PASSWORD: photoup-app-pw-DEMO
  JWT_SECRET: photoup-jwt-DEMO-secret-change-me
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoup-mysql-data
  namespace: photo-up
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoup-uploads
  namespace: photo-up
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoup-mysql
  namespace: photo-up
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photoup
      tier: db
  template:
    metadata:
      labels:
        app: photoup
        tier: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoup-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoup-secrets
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: photoup-mysql-data
        - name: init-sql
          configMap:
            name: photoup-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: photoup-mysql
  namespace: photo-up
spec:
  selector:
    app: photoup
    tier: db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoup-app
  namespace: photo-up
spec:
  replicas: 2
  selector:
    matchLabels:
      app: photoup
      tier: app
  template:
    metadata:
      labels:
        app: photoup
        tier: app
    spec:
      containers:
        - name: app
          image: ghcr.io/hasinesrak/photo-up:sha-e255e09
          imagePullPolicy: Always
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoup-secrets
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: photoup-secrets
                  key: JWT_SECRET
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: UPLOAD_DIR
            - name: PUBLIC_DIR
              valueFrom:
                configMapKeyRef:
                  name: photoup-config
                  key: PUBLIC_DIR
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: photoup-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: photoup-app
  namespace: photo-up
spec:
  type: LoadBalancer
  selector:
    app: photoup
    tier: app
  ports:
    - port: 80
      targetPort: 3000