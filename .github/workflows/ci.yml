name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-up
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: photo-up/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  integration:
    name: API + MySQL integration test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: photoup
          MYSQL_USER: photoup
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: photoup
      DB_USER: photoup
      DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      UPLOAD_DIR: ${{ github.workspace }}/test-uploads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply database schema
        run: |
          CONTAINER=$(docker ps -q --filter ancestor=mysql:8.4)
          docker exec -i "$CONTAINER" sh -c 'exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" photoup' < photo-up/server/init.sql

      - name: Install server dependencies
        run: npm install --no-audit --no-fund
        working-directory: photo-up/server

      - name: Start API server
        working-directory: photo-up/server
        run: |
          node index.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"database":"up"'; then
              echo "API is healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; exit 1

      - name: Register → Login → Upload → List → Delete
        run: |
          set -e
          BASE=http://127.0.0.1:3000

          REGISTER=$(curl -fsS -X POST "$BASE/api/auth/register" \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Bot","email":"ci@example.com","password":"ci-secret-123"}')
          TOKEN=$(echo "$REGISTER" | jq -r .token)
          test "$TOKEN" != "null" && test -n "$TOKEN"

          curl -fsS -X POST "$BASE/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@example.com","password":"ci-secret-123"}' | jq -e .user.email

          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > /tmp/ci.png
          UPLOADED=$(curl -fsS -X POST "$BASE/api/photos" \
            -H "Authorization: Bearer $TOKEN" \
            -F "photo=@/tmp/ci.png;type=image/png")
          PHOTO_ID=$(echo "$UPLOADED" | jq -r .photo.id)
          test -n "$PHOTO_ID" && test "$PHOTO_ID" != "null"

          LIST=$(curl -fsS "$BASE/api/photos" -H "Authorization: Bearer $TOKEN")
          test "$(echo "$LIST" | jq '.photos | length')" -eq 1

          curl -fsS "$BASE$(echo "$LIST" | jq -r .photos[0].url)" -o /tmp/fetched.png
          cmp /tmp/ci.png /tmp/fetched.png

          curl -fsS -X DELETE "$BASE/api/photos/$PHOTO_ID" -H "Authorization: Bearer $TOKEN" | jq -e .ok
          echo "Integration test passed."
