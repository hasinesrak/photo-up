name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR works with the built-in GITHUB_TOKEN — no extra secrets required.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is pushed to only when BOTH secrets are configured:
      #   DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (repo → Settings → Secrets)
      - name: Check Docker Hub credentials
        id: hubcheck
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not set — skipping Docker Hub push (GHCR only)."
          fi

      - uses: docker/login-action@v3
        if: steps.hubcheck.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        name: Compute image names & tags
        run: |
          GHCR="ghcr.io/${{ github.repository }}"
          {
            echo "tags<<EOF"
            # GHCR always
            echo "$GHCR:latest"
            echo "$GHCR:sha-${GITHUB_SHA::7}"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "$GHCR:${GITHUB_REF#refs/tags/}"
            fi
            # Docker Hub when credentials are configured
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/photo-up:latest"
              echo "docker.io/${DOCKERHUB_USERNAME}/photo-up:sha-${GITHUB_SHA::7}"
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                echo "docker.io/${DOCKERHUB_USERNAME}/photo-up:${GITHUB_REF#refs/tags/}"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./photo-up
          file: ./photo-up/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
